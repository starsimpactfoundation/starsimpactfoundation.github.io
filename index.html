<!doctype html>
<html lang="fr">
<head>

<style>
:root{--navy:#102b50;--blue:#1d5689;--red:#d83a43;--ink:#17283d;--muted:#66768a;--paper:#f4f7fb;--line:#e2e9f1;--white:#fff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);line-height:1.6}a{color:inherit;text-decoration:none}button,input,textarea,select{font:inherit}.wrap{width:min(1160px,92%);margin:auto}
.top{background:#0b203b;color:#dce8f4;font-size:12px;padding:8px 0}.top .wrap{display:flex;justify-content:space-between;gap:12px}
header{position:sticky;top:0;background:#ffffffed;backdrop-filter:blur(12px);z-index:10;border-bottom:1px solid var(--line)}.nav{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.04em;color:var(--navy);line-height:1.05}.mark{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:#fff;font-size:23px;position:relative}.mark:after{content:"";position:absolute;width:10px;height:10px;background:var(--red);border:2px solid white;border-radius:50%;right:2px;bottom:2px}.brand small{display:block;font-size:9px;letter-spacing:.22em;color:var(--muted);margin-top:5px}
.links{display:flex;gap:21px;align-items:center;font-size:13px;font-weight:650;color:#35485e}.links a:hover{color:var(--red)}.navtools{display:flex;gap:9px;align-items:center}.lang,.menu{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 11px;color:var(--navy);font-weight:750;cursor:pointer}.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:8px;background:var(--red);color:#fff;padding:12px 18px;font-weight:800;cursor:pointer;transition:.2s}.btn:hover{transform:translateY(-1px);filter:brightness(.96)}.btn.outline{background:transparent;border:1px solid #ffffff80;color:#fff}.btn.light{background:#fff;color:var(--navy);border:1px solid var(--line)}.menu{display:none}
.hero{background:linear-gradient(115deg,#102b50,#174d82 70%,#246395);color:#fff;padding:86px 0 82px;position:relative;overflow:hidden}.hero:after{content:"✦";position:absolute;right:7%;top:-50px;font-size:340px;color:#ffffff0b}.heroGrid{display:grid;grid-template-columns:1.2fr .8fr;gap:50px;align-items:center;position:relative;z-index:1}.eyebrow,.kicker{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:850}.eyebrow{color:#ffb8bd}.hero h1{font-size:clamp(40px,5.5vw,68px);line-height:1.02;letter-spacing:-.045em;margin:15px 0 20px;max-width:720px}.hero p{font-size:17px;color:#e0eaf5;max-width:630px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}.heroVisual{border:1px solid #ffffff40;border-radius:25px;background:linear-gradient(145deg,#ffffff1b,#ffffff08);min-height:300px;display:grid;place-items:center;text-align:center;padding:30px}.heroStar{font-size:100px;line-height:1;text-shadow:0 0 40px #ffffff70}.heroVisual strong{display:block;font-size:21px;margin-top:12px}.heroVisual span{font-size:13px;color:#dce8f4}
.section{padding:76px 0}.soft{background:var(--paper)}.kicker{color:var(--red)}h2{font-size:clamp(29px,3.4vw,42px);line-height:1.13;letter-spacing:-.03em;color:var(--navy);margin:10px 0 15px}.lead{max-width:760px;color:var(--muted);font-size:16px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:30px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:25px;box-shadow:0 8px 25px #102b5007}.ico{width:45px;height:45px;border-radius:13px;background:#edf3f9;color:var(--blue);display:grid;place-items:center;font-size:22px}.card h3{color:var(--navy);margin:16px 0 7px;font-size:18px}.card p{margin:0;color:var(--muted);font-size:14px}
.story{display:grid;grid-template-columns:1fr 1fr;gap:45px;align-items:center}.quote{background:var(--navy);color:white;padding:32px;border-radius:18px}.quote p{font-size:22px;line-height:1.35;margin:0 0 12px}.quote small{color:#c5d4e5}.values{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:22px}.value{padding:15px;border:1px solid var(--line);border-radius:12px;background:white}.value b{display:block;color:var(--navy)}.value span{font-size:13px;color:var(--muted)}
.banner{border:1px solid var(--line);background:#fff;border-radius:18px;padding:30px;display:flex;align-items:center;justify-content:space-between;gap:20px}.banner p{color:var(--muted);margin:0}.banner h2{font-size:28px;margin:5px 0 8px}
.contactGrid{display:grid;grid-template-columns:.8fr 1.2fr;gap:30px}.contactInfo{background:var(--navy);color:white;border-radius:16px;padding:27px}.contactInfo p{color:#d5e1ee;font-size:14px}.formbox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px}.field{margin:0 0 14px}.field label{display:block;font-size:13px;font-weight:750;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #d6e0eb;border-radius:8px;background:white}.field textarea{min-height:110px;resize:vertical}.note{font-size:12px;color:var(--muted)}
footer{background:#0b203b;color:#dce7f2;padding:45px 0 20px}.footgrid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:30px}.footerTitle{font-weight:800;color:white;margin-bottom:12px}.footerLinks a{display:block;color:#b8c8da;font-size:14px;margin:5px 0}.footcopy{border-top:1px solid #ffffff20;margin-top:30px;padding-top:18px;font-size:12px;color:#91a6bf}
.portal{display:none;background:var(--paper);min-height:80vh;padding:42px 0}.portal.active{display:block}.site.hidden{display:none}.panel{max-width:520px;margin:20px auto;background:#fff;border:1px solid var(--line);border-radius:17px;padding:28px;box-shadow:0 15px 40px #102b5010}.panel h2{font-size:29px}.panel label{display:block;font-size:13px;font-weight:750;margin:13px 0 6px}.panel input{width:100%;padding:12px;border:1px solid #d6e0eb;border-radius:8px}.dashboard{display:none}.dashgrid{display:grid;grid-template-columns:220px 1fr;gap:18px;margin-top:22px}.side,.mainbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px}.side a{display:block;padding:9px 0;color:var(--muted);font-size:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.stat{background:#f4f7fb;border-radius:10px;padding:16px}.stat b{display:block;font-size:22px;color:var(--navy)}.stat span{font-size:12px;color:var(--muted)}.pill{display:inline-block;background:#fff1df;color:#94540b;padding:4px 9px;border-radius:20px;font-size:12px}
@media(max-width:900px){.links{display:none}.menu{display:inline-block}.heroGrid,.story,.contactGrid{grid-template-columns:1fr}.heroVisual{min-height:220px}.grid3{grid-template-columns:1fr 1fr}.footgrid{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.top .wrap{justify-content:center;text-align:center}.top .wrap span:last-child{display:none}.nav{min-height:68px}.brand{font-size:14px}.mark{width:38px;height:38px}.navtools .btn{padding:10px 12px;font-size:12px}.grid3,.values,.footgrid{grid-template-columns:1fr}.hero{padding:65px 0}.hero h1{font-size:43px}.section{padding:58px 0}.banner{display:block}.banner .btn{margin-top:18px}.dashgrid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="site" id="site">
<div class="top"><div class="wrap"><span data-fr="Fondation congolaise engagée pour la paix et la jeunesse" data-en="A Congolese foundation committed to peace and youth"></span><span data-fr="Unis pour la paix, engagés pour l’avenir." data-en="United for peace, committed to the future."></span></div></div>
<header><div class="wrap nav">
<a class="brand" href="#home"><span class="mark">✦</span><span>STAR’S <span style="color:var(--red)">IMPACT</span><small>FONDATION · FOUNDATION</small></span></a>
<nav class="links"><a href="#about" data-fr="La fondation" data-en="The Foundation"></a><a href="#mission" data-fr="Notre mission" data-en="Our Mission"></a><a href="#programs" data-fr="Programmes" data-en="Programs"></a><a href="#actions" data-fr="Nos actions" data-en="Our Actions"></a><a href="#contact" data-fr="Contact" data-en="Contact"></a></nav>
<div class="navtools"><button class="lang" id="langBtn" onclick="toggleLang()">EN</button><button class="btn" onclick="openPortal()" data-fr="Espace membre" data-en="Member Area"></button><button class="menu" onclick="document.querySelector('.links').style.display=document.querySelector('.links').style.display==='flex'?'none':'flex'">☰</button></div>
</div></header>
<main>
<section class="hero" id="home"><div class="wrap heroGrid"><div><div class="eyebrow" data-fr="Ensemble, faisons la différence" data-en="Together, let’s make a difference"></div><h1 data-fr="Chaque étoile peut éclairer un avenir." data-en="Every star can illuminate a future."></h1><p data-fr="STAR’S IMPACT rassemble des jeunes engagés autour de la paix, du leadership, de la solidarité et de l’action communautaire." data-en="STAR’S IMPACT brings together committed young people around peace, leadership, solidarity and community action."></p><div class="actions"><a class="btn" href="#about" data-fr="Découvrir la fondation" data-en="Discover the Foundation"></a><a class="btn outline" href="#contact" data-fr="Nous rejoindre" data-en="Get involved"></a></div></div><div class="heroVisual"><div><div class="heroStar">✦</div><strong data-fr="Unis pour la paix" data-en="United for peace"></strong><span data-fr="Engagés pour l’avenir." data-en="Committed to the future."></span></div></div></div></section>
<section class="section" id="about"><div class="wrap story"><div><div class="kicker" data-fr="Qui sommes-nous ?" data-en="Who we are"></div><h2 data-fr="Une jeunesse unie autour d’un impact positif." data-en="Young people united for positive impact."></h2><p class="lead" data-fr="Née d’une communauté de jeunes, STAR’S IMPACT aspire à devenir une fondation autonome, ouverte à toutes celles et ceux qui partagent ses idéaux et souhaitent contribuer à une société plus pacifique, solidaire et inclusive." data-en="Born from a youth community, STAR’S IMPACT aims to become an autonomous foundation, open to everyone who shares its ideals and wishes to contribute to a more peaceful, caring and inclusive society."></p><div class="values"><div class="value"><b data-fr="Paix" data-en="Peace"></b><span data-fr="Le dialogue avant la division." data-en="Dialogue before division."></span></div><div class="value"><b data-fr="Solidarité" data-en="Solidarity"></b><span data-fr="L’entraide comme engagement." data-en="Mutual support as a commitment."></span></div><div class="value"><b data-fr="Inclusion" data-en="Inclusion"></b><span data-fr="La dignité de chacun." data-en="Everyone’s dignity."></span></div><div class="value"><b data-fr="Responsabilité" data-en="Responsibility"></b><span data-fr="Des idées transformées en actes." data-en="Turning ideas into action."></span></div></div></div><aside class="quote"><p data-fr="« Chaque personne porte une étoile dont la lumière mérite d’être éveillée et transformée en impact positif. »" data-en="“Every person carries a star whose light deserves to be awakened and transformed into positive impact.”"></p><small>STAR’S IMPACT · <span data-fr="Notre conviction fondatrice" data-en="Our founding belief"></span></small></aside></div></section>
<section class="section soft" id="mission"><div class="wrap"><div class="kicker" data-fr="Notre mission" data-en="Our mission"></div><h2 data-fr="Faire grandir la paix, le leadership et la solidarité." data-en="Advancing peace, leadership and solidarity."></h2><p class="lead" data-fr="Nous voulons contribuer à une société plus paisible et inclusive en donnant aux jeunes les moyens de devenir des acteurs responsables du changement." data-en="We seek to contribute to a more peaceful and inclusive society by empowering young people to become responsible agents of change."></p><div class="grid3"><article class="card"><div class="ico">☮</div><h3 data-fr="Paix et cohésion" data-en="Peace and cohesion"></h3><p data-fr="Promouvoir le dialogue, le respect mutuel, la prévention des conflits et le vivre-ensemble." data-en="Promoting dialogue, mutual respect, conflict prevention and social cohesion."></p></article><article class="card"><div class="ico">✦</div><h3 data-fr="Leadership des jeunes" data-en="Youth leadership"></h3><p data-fr="Encourager l’initiative, la responsabilité citoyenne et l’émergence de jeunes leaders." data-en="Encouraging initiative, civic responsibility and the emergence of young leaders."></p></article><article class="card"><div class="ico">♡</div><h3 data-fr="Solidarité humanitaire" data-en="Humanitarian solidarity"></h3><p data-fr="Concevoir des actions concrètes de soutien et d’accompagnement des communautés vulnérables." data-en="Developing practical support initiatives for vulnerable communities."></p></article></div></div></section>
<section class="section" id="programs"><div class="wrap"><div class="kicker" data-fr="Nos programmes" data-en="Our programs"></div><h2 data-fr="Transformer les convictions en initiatives." data-en="Turning convictions into initiatives."></h2><div class="grid3"><article class="card"><div class="ico">🤝</div><h3 data-fr="Actions humanitaires" data-en="Humanitarian action"></h3><p data-fr="Visites solidaires, collectes et initiatives d’entraide auprès des personnes vulnérables." data-en="Solidarity visits, collections and mutual-aid initiatives for vulnerable people."></p></article><article class="card"><div class="ico">🎓</div><h3 data-fr="Éducation et citoyenneté" data-en="Education and citizenship"></h3><p data-fr="Échanges, sensibilisation et activités éducatives au service d’une jeunesse responsable." data-en="Discussion, awareness and educational activities for responsible young citizens."></p></article><article class="card"><div class="ico">🌍</div><h3 data-fr="Engagement communautaire" data-en="Community engagement"></h3><p data-fr="Mobiliser les talents et les énergies autour de projets utiles à la collectivité." data-en="Mobilizing talents and energy around projects that serve the community."></p></article></div></div></section>
<section class="section soft" id="actions"><div class="wrap"><div class="kicker" data-fr="Sur le terrain" data-en="On the ground"></div><h2 data-fr="Des actions concrètes, au plus près des communautés." data-en="Practical action, close to communities."></h2><p class="lead" data-fr="Cette rubrique accueillera les comptes rendus, photos et actualités des activités réalisées par la fondation. Les premières publications seront ajoutées après validation des contenus officiels." data-en="This section will host reports, photos and updates from the foundation’s activities. The first publications will be added once official content has been approved."></p><div class="banner" style="margin-top:28px"><div><h2 data-fr="Une initiative à partager ?" data-en="Have an initiative to share?"></h2><p data-fr="Les projets et les nouvelles de STAR’S IMPACT seront publiés ici." data-en="STAR’S IMPACT projects and news will be published here."></p></div><a href="#contact" class="btn" data-fr="Entrer en contact" data-en="Get in touch"></a></div></div></section>
<section class="section" id="contact"><div class="wrap"><div class="kicker" data-fr="Contact" data-en="Contact"></div><h2 data-fr="Construisons l’avenir ensemble." data-en="Let’s build the future together."></h2><div class="contactGrid"><div class="contactInfo"><h3>STAR’S IMPACT</h3><p data-fr="Fondation congolaise — République démocratique du Congo." data-en="Congolese foundation — Democratic Republic of the Congo."></p><p data-fr="Les coordonnées officielles seront ajoutées après leur confirmation." data-en="Official contact details will be added once confirmed."></p><p><b data-fr="Devise" data-en="Motto"></b><br><span data-fr="Unis pour la paix, engagés pour l’avenir." data-en="United for peace, committed to the future."></span></p></div><form class="formbox" onsubmit="contactDemo(event)"><div class="field"><label data-fr="Nom complet" data-en="Full name"></label><input required placeholder=" "></div><div class="field"><label data-fr="Adresse e-mail" data-en="Email address"></label><input type="email" required placeholder=" "></div><div class="field"><label data-fr="Votre message" data-en="Your message"></label><textarea required></textarea></div><button class="btn" type="submit" data-fr="Préparer le message" data-en="Prepare message"></button><p class="note" id="contactNote" data-fr="Formulaire de démonstration : aucun message n’est transmis. Le canal de contact sera configuré avant la mise en ligne." data-en="Demo form: no message is sent. The contact channel will be configured before launch."></p></form></div></div></section>
<section class="section soft"><div class="wrap banner"><div><div class="kicker" data-fr="Rejoindre le mouvement" data-en="Join the movement"></div><h2 data-fr="Votre engagement peut faire la différence." data-en="Your commitment can make a difference."></h2><p data-fr="Prenez part à une initiative porteuse de paix, de solidarité et d’avenir." data-en="Take part in an initiative built on peace, solidarity and hope."></p></div><button class="btn" onclick="openPortal()" data-fr="Accéder à l’espace membre" data-en="Open member area"></button></div></section>
</main>
<footer><div class="wrap"><div class="footgrid"><div><div class="brand" style="color:white"><span class="mark">✦</span><span style="color:white">STAR’S <span style="color:#ff7279">IMPACT</span><small style="color:#b8c8da">FONDATION · FOUNDATION</small></span></div><p style="color:#b8c8da;font-size:14px" data-fr="Unis pour la paix, engagés pour l’avenir." data-en="United for peace, committed to the future."></p></div><div><div class="footerTitle" data-fr="Navigation" data-en="Navigation"></div><div class="footerLinks"><a href="#about" data-fr="La fondation" data-en="The Foundation"></a><a href="#mission" data-fr="Notre mission" data-en="Our Mission"></a><a href="#programs" data-fr="Programmes" data-en="Programs"></a></div></div><div><div class="footerTitle" data-fr="Coordonnées" data-en="Contact details"></div><p style="color:#b8c8da;font-size:14px" data-fr="République démocratique du Congo<br>Coordonnées à confirmer" data-en="Democratic Republic of the Congo<br>Contact details to be confirmed"></p></div></div><div class="footcopy">© <span id="year"></span> STAR’S IMPACT. <span data-fr="Tous droits réservés." data-en="All rights reserved."></span> <span data-fr="Version de développement." data-en="Development version."></span></div></div></footer>
</div>
<section class="portal" id="portal"><div class="wrap"><button class="btn light" onclick="closePortal()" data-fr="← Retour au site" data-en="← Back to website"></button><div class="panel" id="login"><div class="kicker" data-fr="Espace privé" data-en="Private area"></div><h2 data-fr="Connexion membre" data-en="Member sign in"></h2><p class="note" data-fr="Accédez à votre espace personnel STAR’S IMPACT." data-en="Access your personal STAR’S IMPACT area."></p><form onsubmit="demoLogin(event)"><label data-fr="Adresse e-mail" data-en="Email address"></label><input type="email" required placeholder="nom@exemple.com"><label data-fr="Mot de passe" data-en="Password"></label><input type="password" required placeholder="••••••••"><button class="btn" style="width:100%;margin-top:20px" data-fr="Se connecter" data-en="Sign in"></button></form><p class="note" data-fr="Démonstration uniquement : aucune authentification réelle n’est active et aucune donnée n’est enregistrée. La connexion sécurisée nécessitera un serveur et une base de données." data-en="Demo only: real authentication is not active and no data is stored. Secure sign-in will require a server and database."></p></div><div class="dashboard" id="dashboard"><div class="kicker" data-fr="Espace membre · Démonstration" data-en="Member area · Demo"></div><h2 data-fr="Bienvenue dans votre espace" data-en="Welcome to your area"></h2><div class="dashgrid"><aside class="side"><b style="color:var(--navy)" data-fr="Mon espace" data-en="My area"></b><a href="#" onclick="return false" data-fr="Vue d’ensemble" data-en="Overview"></a><a href="#" onclick="return false" data-fr="Mon profil" data-en="My profile"></a><a href="#" onclick="return false" data-fr="Mes cotisations" data-en="My contributions"></a><a href="#" onclick="return false" data-fr="Annonces internes" data-en="Internal notices"></a><a href="#" onclick="logout();return false" data-fr="Déconnexion" data-en="Sign out"></a></aside><div class="mainbox"><h3 data-fr="Tableau de bord" data-en="Dashboard"></h3><p data-fr="Bonjour, membre STAR’S IMPACT." data-en="Hello, STAR’S IMPACT member."></p><div class="stats"><div class="stat"><b>—</b><span data-fr="Statut du membre" data-en="Membership status"></span></div><div class="stat"><b>—</b><span data-fr="Cotisations enregistrées" data-en="Contributions recorded"></span></div><div class="stat"><b><span class="pill" data-fr="À configurer" data-en="To be configured"></span></b><span data-fr="Situation du compte" data-en="Account status"></span></div></div><p class="note" data-fr="Toutes les informations sont fictives. Les profils, rôles, paiements et historiques seront reliés à une base de données sécurisée dans la version de production." data-en="All information is fictitious. Profiles, roles, payments and histories will be connected to a secure database in the production version."></p></div></div></div></div></section>
<script>
let language='fr';
function applyLanguage(){document.documentElement.lang=language;document.querySelectorAll('[data-fr]').forEach(el=>{const value=el.getAttribute('data-'+language);if(value!==null)el.innerHTML=value});document.getElementById('langBtn').textContent=language==='fr'?'EN':'FR'}
function toggleLang(){language=language==='fr'?'en':'fr';applyLanguage()}
function openPortal(){document.getElementById('site').classList.add('hidden');document.getElementById('portal').classList.add('active');window.scrollTo(0,0)}
function closePortal(){document.getElementById('portal').classList.remove('active');document.getElementById('site').classList.remove('hidden');window.scrollTo(0,0)}
function demoLogin(e){e.preventDefault();document.getElementById('login').style.display='none';document.getElementById('dashboard').style.display='block'}
function logout(){document.getElementById('dashboard').style.display='none';document.getElementById('login').style.display='block'}
function contactDemo(e){e.preventDefault();document.getElementById('contactNote').textContent=language==='fr'?'Merci. Le formulaire est une démonstration et ne transmet pas encore les messages.':'Thank you. This form is a demo and does not send messages yet.'}
document.getElementById('year').textContent=new Date().getFullYear();applyLanguage();
</script>
</body></html>
